name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Mirrors docker-compose.yml. application.yaml and ServerTest have no environment overrides:
    # they connect to localhost:5432 (database pizzadb, user pizza) and localhost:6379,
    # so the service containers publish exactly those ports with the same credentials.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pizzadb
          POSTGRES_USER: pizza
          POSTGRES_PASSWORD: pizza
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pizza -d pizzadb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: Build and test
        run: ./gradlew build
